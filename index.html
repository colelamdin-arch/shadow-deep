const oldPrepare=prepareMission;prepareMission=function(){if(encounterExists()){show('play');return}let m=missionData[S.scenario];if(!active().length){toast('Create or activate a hero first');return}if(!confirm('Commence '+(S.customScenario||S.scenario)+' with '+active().length+' active heroes? Your campaign will be saved before the battle starts.'))return;let before=clone(S);delete before.session;let participants=active().map(c=>c.id);S.session={id:uid(),started:new Date().toISOString(),participants,before,log:[],downed:active().filter(c=>c.hp<=0).map(c=>c.id),survival:{},clues:[]};S.prepared=true;S.turn=1;S.phase=0;S.scenarioXP=0;S.enemySerial=0;S.removedEnemies=[];S.enemies=[];S.objectives=[];S.deck=[];S.drawn=[];S.challengeApplied=[];S.rolls=[];active().forEach(c=>{c.activated=false;c.used=[]});if(m&&!S.customScenario){let foes={...m.foes};if(S.challenge)for(let [t,q] of Object.entries(challengeData[S.scenario]?.extra||{}))foes[t]=(foes[t]||0)+q;for(let [t,q] of Object.entries(foes))for(let i=0;i<q;i++){let v=monsters[t];if(v)S.enemies.push({id:uid(),type:t,name:t+' '+(i+1),stats:v.slice(0,6),hp:v[5],xp:v[6],traits:v[7],awarded:false,activated:false})}for(let [label,xp,q] of [...m.obj,...(extraObjectives[S.scenario]||[])])for(let i=0;i<q;i++)S.objectives.push({id:uid(),text:label+(q>1?' '+(i+1):''),xp,done:false});S.deck=presetCards(m);for(let i=S.deck.length-1;i>0;i--){let j=rnd(i+1)-1;[S.deck[i],S.deck[j]]=[S.deck[j],S.deck[i]]}S.roundLimit=m.turns;}commit();show('play');toast('Scenario started. Progress will be saved.');};
missionReference=function(){let m=missionData[S.scenario],b=briefing[S.scenario],live=!!S.session;if(S.customScenario||!m||!b)return `<div class="panel stack section"><h2>Custom briefing</h2><p>Prepare your own tabletop and add enemies and objectives after commencement.</p><button class="primary" onclick="prepareMission()">${live?'Resume battle':'Commence scenario'}</button></div>`;let k=S.scenario+'|'+(S.challenge?'challenge':'standard'),checks=S.briefChecks?.[k]||{};return `<div class="panel stack section briefing"><div class="eyebrow">${live?'ACTIVE SCENARIO':'PREPARATION · NOT STARTED'} · FIELD BRIEFING</div><h2>${esc(S.scenario)}</h2><p>${esc(b.story)}</p><div class="grid"><div class="stat"><small>Duration</small><b>${m.turns||'Variable'} ${m.turns?'turns':''}</b></div><div class="stat"><small>Active party</small><b>${active().length} heroes</b></div><div class="stat"><small>Rulebook</small><b>pp. ${m.p}–${m.end}</b></div></div><div class="two"><div class="stack"><h3>⚑ Table preparation</h3>${b.terrain.map((t,i)=>`<label class="check"><input type="checkbox" ${checks[i]?'checked':''} onchange="briefingCheck(${i},this.checked)"><span>${esc(t)}</span></label>`).join('')}</div><div class="stack"><h3>Battlefield sketch</h3>${schematic(S.scenario)}</div></div><div class="two"><div class="stack"><h3>✧ Before battle</h3>${b.checks.map(t=>`<div class="note">${esc(t)}</div>`).join('')}<h3>⚔ Special rules</h3>${b.rules.map(t=>`<div class="note">${esc(t)}</div>`).join('')}</div><div class="stack"><h3>Starting deployment</h3>${active().map(c=>`<div class="row between"><span>${esc(c.name)}</span><small>${c.hp}/${c.stats[5]} HP</small></div>`).join('')||'<small>No heroes</small>'}${Object.entries({...m.foes,...(S.challenge?Object.fromEntries(Object.entries(challengeData[S.scenario]?.extra||{}).map(([t,q])=>[t,(m.foes[t]||0)+q])):{})}).map(([t,q])=>`<div class="row between"><span>${esc(t)}</span><b>×${q}</b></div>`).join('')||'<small>Enemies revealed through events or room cards.</small>'}<h3>XP objectives</h3>${[...m.obj,...(extraObjectives[S.scenario]||[])].map(([t,x,q])=>`<div class="row between"><span>${esc(t)} ${q>1?'×'+q:''}</span><small>+${x} XP each</small></div>`).join('')||'<small>Record discoveries and scenario-specific awards as revealed.</small>'}<small>Creature XP and hidden discovery awards are recorded during battle; check book for exceptions.</small><h3>End conditions</h3><div class="note">${esc(b.end)}</div></div></div>${challengePanel()}<div class="row"><button class="primary" onclick="prepareMission()">${live?'Resume scenario →':'⚔ Commence scenario'}</button>${live?'<button class="danger" onclick="abandonEncounter()">Abandon / undo start</button>':'<small>Viewing or checking this briefing does not start a game.</small>'}</div></div>`};
const oldPlay=play;play=function(){if(!S.session)return `<div class="panel stack hero-banner"><div class="eyebrow">BATTLE STATION · STANDBY</div><h2>No scenario in progress</h2><p>Prepare your tabletop, choose your difficulty and commence when ready. Your heroes remain in the roster until then.</p><button class="primary" onclick="show('campaign')">Open mission briefing →</button></div>${missionReference()}`;let b=briefing[S.scenario];return `<div class="panel stack session-banner"><div class="row between"><div><div class="eyebrow">● IN PROGRESS · AUTOSAVE</div><h2>${esc(S.customScenario||S.scenario)}</h2><small>${S.session.participants.length} deployed · ${S.enemies.filter(e=>e.hp>0).length} creatures standing</small></div><div class="row"><button onclick="show('campaign')">Briefing</button><button onclick="show('dashboard')">Pause / exit battle</button><button class="danger" onclick="abandonEncounter()">Abandon scenario</button></div></div></div>`+oldPlay().replace(/<button onclick="prepareMission\(\)">Prepare encounter<\/button>/,'')+`<div class="panel stack section"><h3>Discoveries & field notes</h3>${secretClues[S.scenario]?'<button class="primary" onclick="clueDialog()">Investigate clue / cocoon</button>':''}<button onclick="fieldNote()">+ Log discovery, loot or special rule</button>${S.session.clues.map(c=>`<div class="note"><b>${esc(c.result)}</b> · ${esc(c.hero)} (d20 ${c.die})<br>${esc(c.effect)}</div>`).join('')}${b?`<details><summary>Scenario rules and end conditions</summary>${b.rules.map(t=>`<p>${esc(t)}</p>`).join('')}<p>${esc(b.end)}</p></details>`:''}</div>`+sessionLogHTML()};

function noteReveal(id,who='Company',applyXP=true){let f=fieldState(),v=notes[id];if(!f||!v)return;let existing=f.notes.find(n=>n.id===id);if(!existing){f.notes.push({id,who,text:v[0],xp:v[1]});if(applyXP)S.scenarioXP+=v[1];appendField('Note '+id+' · '+who+': '+v[0]+(v[1]?' (+'+v[1]+' XP)':''));}return v;}
function openNoteSelector(){let d=$('editor');if(!d.open)d.showModal();d.innerHTML=`<form id="noteForm" class="stack"><div class="eyebrow">Sealed discoveries</div><h2>Reveal numbered note</h2><p>Enter only a note number referenced by your current encounter. Previously opened notes will not award XP twice.</p>${field('Note number',input('noteNumber','','number','min=100 max=999 required'))}${field('Hero',`<select id="noteHero">${figureOptions(active())}</select>`)}<button class="primary">Reveal</button><button type="button" onclick="$('editor').close()">Cancel</button></form>`;$('noteForm').onsubmit=e=>{e.preventDefault();let id=+$('noteNumber').value,v=noteReveal(id,get($('noteHero').value)?.name||'Company');if(!v){toast('No such note');return}commit();showRevealedNotes([id])};}
function showRevealedNotes(ids){let d=$('editor');if(!d.open)d.showModal();d.innerHTML=`<div class="stack"><div class="eyebrow">Discovered intelligence</div><h2>Reveal</h2>${ids.map(id=>`<div class="note"><b>Note ${id} ${notes[id][1]?`· +${notes[id][1]} XP`:''}</b><p>${esc(notes[id][0])}</p></div>`).join('')||'<p>No further discovery.</p>'}<div class="row"><button onclick="openNoteSelector()">Reveal linked note</button><button onclick="pageViewer(115)">Original notes (spoilers)</button><button class="primary" onclick="$('editor').close()">Back to battle</button></div></div>`;}
function modifierFor(c,k){let i=statNames.indexOf(k);return i===5?c.hp:i>=0?c.stats[i]:n(c.skills?.[k]);}
function investigatePOI(index){let f=fieldState(),r=poi[S.scenario]?.[index];if(!f||!r)return;let [key,label,choices,success,fail,retry,tiers]=r;if(f.poi[key]?.done){showRevealedNotes(f.poi[key].ids||[]);return}let d=$('editor'),eligible=active().filter(c=>c.hp>0&&!animals.includes(c.type));if(!eligible.length){toast('No eligible hero');return}if(!d.open)d.showModal();d.innerHTML=`<form id="poiForm" class="stack"><div class="eyebrow">Point of interest ${key}</div><h2>${esc(label)}</h2>${field('Hero',`<select id="poiHero">${figureOptions(eligible)}</select>`)}${choices.length?field('Check',`<select id="poiCheck">${choices.map(([k,tn],i)=>`<option value="${i}">${k} · TN ${tn}</option>`).join('')}</select>`)+field('Physical d20 (blank = digital roll)',input('poiDie','','number','min=1 max=20'))+field('Extra modifier',input('poiMod',0,'number')):'<p>Resolve when your figure interacts with this point as directed. Spend an action if required.</p>'}<button class="primary">${choices.length?'Resolve check':'Reveal discovery'}</button><button type="button" onclick="$('editor').close()">Cancel</button></form>`;$('poiForm').onsubmit=e=>{e.preventDefault();let c=get($('poiHero').value),ok=true,die=0,total=0;if(choices.length){let [k,tn]=choices[+$('poiCheck').value];die=+$('poiDie').value||rnd(20);total=die+modifierFor(c,k)+n($('poiMod').value);ok=die===20||(die!==1&&total>=tn);logResult(c.name+' '+k,`${die} → ${total} (${ok?'pass':'fail'})`);appendField(c.name+' checks point '+key+': '+k+' '+total+' vs '+tn+' · '+(ok?'pass':'fail'));}let ids=ok?(tiers?success.filter((id,i)=>total>=tiers[i]||i===0&&die===20):success):fail?[fail]:[];ids.forEach(id=>noteReveal(id,c.name));f.poi[key]={done:ok||!retry,ids,hero:c.name,die,total,passed:ok,attempts:(f.poi[key]?.attempts||0)+1};if(ok&&S.scenario==='The Ruined Chapel'&&key==='C')appendField('Place a treasure token on the ledge.');if(!ok&&S.scenario==='The Abbess’ Quarters'&&key==='C')c.hp=Math.max(0,c.hp-1);commit();if(ids.length)showRevealedNotes(ids);else{d.innerHTML=`<div class="stack"><h2>${ok?'Success':'Failed check'}</h2><p>${ok?'Point resolved. '+(key==='C'&&S.scenario==='The Ruined Chapel'?'Place a treasure token on ledge.':''):retry?'You may retry this point during play.':'No further discovery.'}</p><button onclick="$('editor').close()">Return to battle</button></div>`;}};}
function roomReveal(){let f=fieldState();if(!f||!S.deck.length||f.rooms.length>=3){toast('All rooms have been opened');return}let d=$('editor');if(!d.open)d.showModal();let letter='ABC'[f.rooms.length],prior=f.rooms.at(-1);d.innerHTML=`<form class="stack" id="roomForm"><div class="eyebrow">Tor Varden · room ${letter}</div><h2>Open room ${letter}</h2><p>${prior?`Previous door deadline: end of turn ${prior.deadline}.`:'Apply penalty if entry checks failed or the vulture escaped.'}</p><label class="check"><input type="checkbox" id="roomPenalty" ${prior&&S.turn>prior.deadline?'checked':''}> Room penalty applies</label><button class="primary">Draw and deploy room</button><button type="button" onclick="$('editor').close()">Cancel</button></form>`;$('roomForm').onsubmit=e=>{e.preventDefault();let penalty=$('roomPenalty').checked,card=S.deck.pop();S.drawn.unshift(card);let i=ranks.indexOf(card.split(' ')[1]),packs=[penalty?{'Gnoll Fighter':2,'Gnoll Archer':2}:{'Gnoll Fighter':4},{'Gnoll Sergeant':1,'Gnoll Fighter':2},penalty?{'Gnoll Archer':1,'Gnoll Sergeant':2}:{'Gnoll Archer':1,'Gnoll Fighter':2},{'Gnoll Shaman':1,'Gnoll Fighter':2}][i]||{};for(let [t,q] of Object.entries(packs))spawnField(t,q);if(S.challenge)spawnField('Gnoll Sergeant');let room={letter,card,penalty,turn:S.turn,deadline:S.turn+(i===3?5:4),effect:currentEvent(card)};f.rooms.push(room);f.resolved.push(S.drawn.length);S.challengeApplied.push('room:'+S.drawn.length);appendField('Opened room '+letter+' · '+card+(penalty?' · penalty':''));commit();d.innerHTML=`<div class="stack"><h2>Room ${letter} · ${['Storage','Torture','Armoury','Workshop'][i]}</h2><p>${esc(room.effect)}</p><p>${penalty?'Penalty applied.':'No penalty.'} ${S.challenge?'Extra challenge sergeant deployed.':''}</p><small>Next room deadline: end of turn ${room.deadline}. Place figures and markers on your table.</small><button onclick="$('editor').close()">Continue</button></div>`;};}
function scenarioCheck(i){let f=fieldState(),b=briefing[S.scenario];if(!f||!b)return;let d=$('editor');if(!d.open)d.showModal();d.innerHTML=`<form class="stack" id="precheckForm"><h2>Scenario check</h2><div class="note">${esc(b.checks[i])}</div>${field('Hero',`<select id="preHero">${figureOptions(active())}</select>`)}${field('Skill/stat',`<select id="preKind">${opts([...skills,...statNames], 'Perception')}</select>`)}${field('Target number',input('preTN',8,'number','required min=0'))}${field('Physical d20 (optional)',input('preDie','','number','min=1 max=20'))}${field('Extra modifier',input('preMod',0,'number'))}<button class="primary">Roll and record</button><button type="button" onclick="$('editor').close()">Cancel</button></form>`;$('precheckForm').onsubmit=e=>{e.preventDefault();let c=get($('preHero').value),k=$('preKind').value,tn=+$('preTN').value,die=+$('preDie').value||rnd(20),total=die+modifierFor(c,k)+n($('preMod').value),ok=die===20||die!==1&&total>=tn;f.checks.push({i,hero:c.name,k,tn,die,total,ok});appendField(`${c.name} ${k} ${total} vs TN${tn}: ${ok?'success':'failure'}. ${b.checks[i]}`);commit();d.innerHTML=`<div class="stack"><h2>${ok?'Success':'Failure'} · ${total}</h2><p>${esc(b.checks[i])}</p><p>Apply the listed tabletop effect and record any HP, item or deployment change.</p><button onclick="$('editor').close()">Continue</button></div>`;};}
function fieldConsole(){let f=fieldState(),b=briefing[S.scenario],m=missionData[S.scenario];if(!f||!m||!b)return '';return `<div class="panel stack field-console section"><div class="row between"><div><div class="eyebrow">Scenario command console</div><h3>✦ Field operations</h3></div><button onclick="pageViewer(${m.p})">Original setup</button></div>${b.checks.filter(x=>!x.startsWith('None')).length?`<details open><summary>Scenario checks · ${f.checks.length} recorded</summary><div class="stack">${b.checks.map((t,i)=>`<div class="row between"><span style="flex:1">${esc(t)}</span><button onclick="scenarioCheck(${i})">Roll</button></div>`).join('')}</div></details>`:''}${m.room?`<h3>Rooms · ${f.rooms.length}/3</h3><button class="primary" onclick="roomReveal()" ${f.rooms.length>=3?'disabled':''}>Open next room</button>${f.rooms.map(r=>`<div class="note"><b>Room ${r.letter} · ${esc(r.card)}</b> · ${r.penalty?'Penalty':'No penalty'}<br>${esc(r.effect)}<br>Deadline: turn ${r.deadline}</div>`).join('')}`:''}${poi[S.scenario]?`<h3>Points of interest</h3><p class="muted">Choose the point your miniature reaches; hidden results are revealed after the check.</p><div class="poi-grid">${poi[S.scenario].map((r,i)=>`<button onclick="investigatePOI(${i})"><b>${f.poi[r[0]]?.done?'✓ ':''}${r[0]} · ${esc(r[1])}</b><small>${r[2].map(([k,t])=>k+' TN'+t).join(' / ')||'Interact'}</small></button>`).join('')}</div>`:''}${m.burning?`<button onclick="openNoteSelector()">Reveal referenced numbered note</button>${f.notes.length?`<details><summary>Discovered notes (${f.notes.length})</summary>${f.notes.map(n=>`<div class="note"><b>${n.id}</b> · ${esc(n.who)} · ${n.xp} XP<br>${esc(n.text)}</div>`).join('')}</details>`:''}`:''}<div class="row"><button onclick="pageViewer(${m.end})">Scenario tables & exceptions</button><button onclick="pageViewer(35)">Creature behavior</button><button onclick="pageViewer(44)">Post-battle rules</button></div></div>`;}
const priorPlay=play;play=function(){let h=priorPlay();if(!S.session)return h;return h.replace('Drawn: '+esc(S.drawn.join(', ')||'None')+'. Use your rulebook to resolve special rules.','Drawn: '+esc(S.drawn.join(', ')||'None')+'. Resolve each revealed event before continuing.').replace('<h2 class="section">'+icon('crest')+' Heroes on the table</h2>',fieldConsole()+'<h2 class="section">'+icon('crest')+' Heroes on the table</h2>')};

const priorFinish=finishScenario;finishScenario=function(){if(!S.session)return;let field=clone(fieldState()),sessionID=S.session.id;priorFinish();let form=$('endForm');if(!form)return;let original=form.onsubmit;form.onsubmit=e=>{original(e);if(!S.session&&S.history[0]?.sessionId===sessionID){S.history[0].field=field;commit()}}};

const companionDescriptions={"Arcanist": ["Lore specialist", "A scholar of ancient histories, myths and forgotten languages who brings intellectual expertise rather than exceptional martial skill.", "Decipher inscriptions and identify unfamiliar relics; Ancient Lore +5 and Read Runes +5."], "Archer": ["Ranged support", "A trained missile specialist who fights from a distance with a bow or crossbow.", "Provide covering fire and attack enemies before they reach the company."], "Barbarian": ["Powerful melee fighter", "A hardy warrior from outside settled lands, relying on physical strength and resilience rather than heavy armour.", "Fight tough enemies and handle strength-based obstacles. Fight +4, Health 14 and Strength +5."], "Conjuror": ["Spellcaster", "A practical magic-user who puts arcane knowledge to work in the field.", "Customize magical support before each scenario: healing, protection, utility or offensive spells."], "Guardsman": ["Heavy weapon infantry", "A soldier trained to use large two-handed weapons, such as halberds and battle axes.", "Deliver extra melee damage with a two-handed weapon while wearing light armour."], "Hound": ["Fast animal ally", "A loyal dog that accompanies its master into danger.", "An inexpensive, mobile ally for scouting and supporting combats."], "Warhound": ["Combat animal", "A tougher fighting dog bred and trained for combat.", "Support melee fighters; compared with a regular hound, it has +1 Fight and 2 more Health."], "Bloodhound": ["Tracking animal", "A scent-tracking dog that helps rangers follow trails.", "Use its Track +5 and nearby ranger tracking bonus on pursuit and reconnaissance missions."], "Knight": ["Armoured frontline fighter", "An elite soldier with excellent close-combat training and heavy protective equipment.", "Hold the front line and protect vulnerable allies. Armour 13 and Fight +4, but Move 5."], "Man-at-Arms": ["Versatile infantry", "A regular soldier trained to engage enemies at close quarters with weapon and shield.", "A balanced defensive fighter with Armour 12, Fight +3 and moderate recruitment cost."], "Raptor": ["Flying scout", "A trained bird of prey, such as a hawk or falcon, with keen eyesight and aerial mobility.", "Scout difficult terrain with Move 9 and Perception +4. Health 1 makes it fragile."], "Recruit": ["Budget infantry", "A junior member of the Rangers with little experience, but basic combat training.", "Fill out the company cheaply and develop a useful additional skill through recruitment."], "Rogue": ["Infiltration specialist", "A nimble specialist in locks, traps and covert movement rather than direct fighting.", "Open locked doors, disarm traps and scout unseen. Pick Lock, Traps and Stealth are each +5."], "Savage": ["Heavy assault fighter", "A ferocious warrior who favours powerful two-handed weapons over defensive equipment.", "Deliver damaging melee blows with Fight +4 and Strength +5; Armour 10 leaves it exposed."], "Swordsman": ["Skilled duelist", "An accomplished blade fighter, often trained through the traditions of noble households.", "Fight effectively in melee with Fight +4 without relying on heavy armour."], "Templar": ["Heavy assault knight", "A knight trained to wield two-handed weapons against formidable creatures.", "Fight large enemies with Fight +4, heavy armour and increased weapon damage."], "Tracker": ["Wilderness specialist", "A countryside huntsman with archery and trail-reading skills.", "Follow enemy trails with Track +5, Move 7 and ranged support from a bow."]};

function captureCompanionDraft(){let c=companionDraft;if(!$('compForm'))return;c.name=$('cpName').value.trim()||c.type;c.owner='';c.active=$('cpActive').checked;c.notes=$('cpNotes').value;c.injuries=$('cpInjuries').value;if($('cpHP'))c.hp=Math.max(0,Math.min(c.stats[5],n($('cpHP').value)));if($('cpBonus')){let v=$('cpBonus').value;if(c.bonusSkill!==v){if(c.bonusSkill)c.skills[c.bonusSkill]=Math.max(0,n(c.skills[c.bonusSkill])-3);c.bonusSkill=v;if(v)c.skills[v]=n(c.skills[v])+3}}if($('cpGear')){c.equipment=compGear(c.type,$('cpGear').value)}if(c.type==='Conjuror'&&$('cpSpell0')){let old=[...c.abilities,...c.spells],usedNames=c.used.map(i=>old[i]);c.conjSpells=Array.from({length:c.conjExtra?3:2},(_,i)=>$('cpSpell'+i)?.value||'').filter(Boolean);c.spells=[...c.conjSpells,...(c.earnedSpells||[])];c.used=[...c.abilities,...c.spells].map((x,i)=>{let ix=usedNames.indexOf(x);if(ix<0)return -1;usedNames.splice(ix,1);return i}).filter(x=>x>=0)}if($('cpPP'))c.pp=Math.min(100,Math.max(0,Math.floor(n($('cpPP').value))));if($('cpManual0')){let oldMax=c.stats[5];c.stats=statNames.map((_,i)=>n($('cpManual'+i).value,c.stats[i]));c.stats[5]=Math.max(1,c.stats[5]);c.hp=Math.min(c.hp,c.stats[5]);}}

const prevRollTreasureComp=rollTreasure;rollTreasure=function(){prevRollTreasureComp();let b=$('takeTreasure'),sel=$('treasureWho');if(!b||!sel)return;let fn=b.onclick; // Inspect the actual revealed result rather than rerolling.
let name=$('treasureResult').querySelector('h3')?.textContent;let match;for(let group of ['Potions','Enchantments','Relics']){let index=library[group].findIndex(x=>x.name===name);if(index>=0){match={group,index};break}}if(!match)return;for(let o of sel.options){let c=get(o.value);if(c&&!validCompRecipient(c,match.group,match.index))o.disabled=true}let ok=[...sel.options].find(o=>!o.disabled);if(ok)sel.value=ok.value;else b.disabled=true;b.onclick=()=>{let c=get(sel.value);if(!c||!validCompRecipient(c,match.group,match.index)){toast('Recipient cannot carry this treasure.');return}fn()}};

// Shared company recruitment. The visible party has no owners; a feasibility check respects p. 37's individual allowances.
function partyRangers(){return S.rangers.filter(c=>c.active!==false&&(!S.session||S.session.participants.includes(c.id)))}
function partyCompanions(){return S.companions.filter(c=>c.active!==false&&(!S.session||S.session.participants.includes(c.id)))}
function partyBudgetFor(r,k){let b=n(r.brp,100),lead=n(r.skills?.Leadership),amulet=(r.inventory||[]).some(x=>x.name==='Amulet of Leadership')?5:0;return Math.max(0,Math.floor(k===1?b:k===2?b*.5-10:k===3?b*.3:k===4?b*.1:0)+lead+amulet)}
function partyStatus(draft=null){let rs=partyRangers(),cs=partyCompanions().filter(c=>!draft||c.id!==draft.id);if(draft&&draft.active!==false)cs.push(draft);let k=rs.length,per=[0,7,3,2,1][k]||0,allow=rs.map(r=>partyBudgetFor(r,k)),budget=allow.reduce((a,b)=>a+b,0),limit=k*per,paid=cs.filter(c=>!c.scenarioFree),spent=paid.reduce((a,c)=>a+n(c.rp),0),count=paid.length,reason='';if(k<1||k>4)reason='Deploy between one and four rangers.';else if(count>limit)reason='Too many recruited companions for this ranger count.';else if(spent>budget)reason='Recruitment points exceeded.';else{let costs=paid.map(c=>Math.max(0,n(c.rp))).sort((a,b)=>b-a),slots=allow.map(()=>per),remaining=[...allow],seen=new Set();function fit(i){if(i===costs.length)return true;let key=i+'|'+remaining.map((b,j)=>b+':'+slots[j]).sort().join(',');if(seen.has(key))return false;seen.add(key);for(let j=0;j<remaining.length;j++){if(slots[j]&&remaining[j]>=costs[i]){remaining[j]-=costs[i];slots[j]--;if(fit(i+1))return true;slots[j]++;remaining[j]+=costs[i]}}return false}if(!fit(0))reason='The combined points fit, but these companion costs cannot fit within the individual ranger allowances.'}return {k,per,allow,budget,limit,spent,count,total:k+cs.length,free:cs.length-count,legal:!reason,reason}}
function partySummary(p){return `<div class="row between"><b>${p.k} ranger${p.k===1?'':'s'} · ${p.count} recruited companion${p.count===1?'':'s'}${p.free?' · '+p.free+' free ally':''}</b><span class="${p.legal?'good':'warning'}">${p.legal?'✓ Rules-valid':'⚠ Needs adjustment'}</span></div><div class="grid party-metrics"><div class="stat"><small>Recruitment points</small><b>${p.spent} / ${p.budget}</b><small>${p.budget-p.spent} RP remaining</small></div><div class="stat"><small>Companion slots</small><b>${p.count} / ${p.limit}</b><small>${p.limit-p.count} remaining</small></div><div class="stat"><small>Total deployed heroes</small><b>${p.total}</b></div></div>`}
function partyPanel(){let p=partyStatus();return `<div class="panel stack section party-panel"><div class="eyebrow">Shared company · recruitment</div><h3>${icon('people')} Party composition</h3>${partySummary(p)}${p.reason?`<p class="warning">${esc(p.reason)} ${S.session?'Current encounter is retained.':'Adjust the active roster before commencing.'}</p>`:''}<small>${S.session?'Party size is locked for this scenario.':'Use Deploy / Reserve on the Current Party tab to choose who takes part.'} Active ranger count determines the multiplayer-equivalent limits. No manual companion assignments.</small><details><summary>Recruitment rules and individual allowances (p. 37)</summary><p class="muted">1 ranger: full BRP, 7 companions. 2: half BRP − 10 each, 3 companions each. 3: 30% BRP each, 2 companions each. 4: 10% BRP each, 1 companion each. Add each ranger’s Leadership and applicable item bonuses. The shared roster is checked for a valid distribution of costs and slots, without storing an assignment.</p>${partyRangers().map((r,i)=>`<div class="listline"><span>${esc(r.name)}</span><b>${p.allow[i]} RP · ${p.per} slots</b></div>`).join('')}<small>Scenario-granted free allies may exceed normal limits when the scenario explicitly permits them.</small></details>${tab!=='party'?`<button onclick="show('party')">Manage active party →</button>`:''}</div>`}
function partyRosterCard(c){let h=card(c);return h.replace('</article>',`<button ${S.session?'disabled':''} onclick="setPartyActive('${c.id}')">${c.active===false?'Deploy with company':'Move to reserve'}</button></article>`)}
function setPartyActive(id){if(get(id)?.dead||get(id)?.retired){toast('This character is deceased or retired.');return}if(S.session){toast('Finish or abandon the scenario before changing the party.');return}let c=get(id);if(!c)return;if(c.active===false&&c.kind==='ranger'&&partyRangers().length>=4){toast('Maximum four active rangers.');return}if(c.active===false&&c.kind==='companion'){let p=partyStatus({...c,active:true});if(!p.legal){toast(p.reason);return}}c.active=c.active===false;commit()}

function G(){if(!S.session)return null;return S.session.guided||=( {turn:S.turn,phase:S.phase,actor:null,actions:{},early:{},events:{},treasure:[],secured:0,post:false,temporary:[],effects:{},survivalApplied:{}} );}
function guideFigure(id){return get(id)||S.enemies.find(e=>e.id===id)}
function guideHeroes(){return all().filter(c=>S.session.participants.includes(c.id)&&c.active!==false)}
function guideEligible(){let g=G(),heroes=guideHeroes().filter(c=>c.hp>0&&!c.activated&&!fieldState().exited.includes(c.id));if(S.phase===0){let rs=heroes.filter(c=>c.kind==='ranger').sort((a,b)=>b.stats[4]-a.stats[4]);let cap=S.players===1?2:S.players===2?2:0;let extra=Object.values(g.early||{}).filter(Boolean).length;return [...rs,...(extra<cap+(g.callExtra||0)?heroes.filter(c=>c.kind==='companion'):[])];}if(S.phase===1){let es=S.enemies.filter(c=>c.hp>0&&!c.activated).sort((a,b)=>b.hp-a.hp);return es;}if(S.phase===2)return heroes.filter(c=>c.kind==='companion');return []}
function guideSync(){let g=G();if(!g)return;if(g.turn!==S.turn){g.turn=S.turn;g.actions={};g.early={};g.callExtra=0;g.actor=null;}if(g.phase!==S.phase){g.phase=S.phase;g.actor=null;}if(g.actor){let c=guideFigure(g.actor);if(!c||c.hp<=0||c.activated||!guideEligible().some(x=>x.id===c.id))g.actor=null;}}

function guideStart(id){guideSync();let g=G(),c=guideFigure(id);if(g.post||!guideEligible().some(x=>x.id===id))return;if(g.actor&&g.actor!==id){toast('Finish the current activation first.');return}if(!g.actions[id]){let max=c.conditions?.includes('Poisoned')?1:2;let skip=c.conditions?.includes('Stunned')||c.conditions?.includes('Down');g.actions[id]={max:skip?0:max,used:[],ability:false,spell:false};if(skip){c.conditions=c.conditions.filter(x=>x!=='Stunned');}guideLog(c.name+' began activation ('+(skip?0:max)+' actions)');}g.actor=id;commit();}
function guideCanAction(id,type){let g=G(),a=g?.actions[id],c=guideFigure(id);if(!a||g.actor!==id||c?.activated||a.used.length>=a.max)return false;return type==='move'?(!a.used.includes('replaceMove')||a.used.length===0):type==='replaceMove'?(!a.used.includes('move')&&!a.used.includes('replaceMove')):a.used.filter(x=>x!=='move'&&x!=='replaceMove').length===0;}

    '<button onclick="commandOpenSheet('+index+')" aria-label="Open sheet: '+esc(c.name||'Unnamed figure')+'">Open sheet</button></div>'+
    '<div class="command-vitals"><div class="command-chips"><span class="command-chip '+tone+'">'+status+'</span>'+
    '<b>'+hpNow+' / '+max+' HP</b></div><small>'+(r?'Level '+n(c.level)+' · '+n(c.xp)+' XP':n(c.pp)+' PP')+'</small></div>'+
    (conditions.length?'<div class="command-chips">'+conditions.map(v=>'<span class="command-chip alert">'+esc(v)+'</span>').join('')+'</div>':'')+
    '<dl>'+detail('Equipment',baseGear.join(', ')||(animals.includes(c.type)?'No carried gear':'None recorded'))+
    (inventory.length?detail('Other items',inventory.join(', ')):'')+
    (injuries.length?detail('Injuries',injuries.join('\n')):'')+'</dl></article>';
}
function commandDashboard(){
  const live=!!S.session, post=!!S.session?.guided?.post;
  const mission=S.mission||'No mission selected', scenario=S.customScenario||S.scenario||'No scenario selected';
  const history=Array.isArray(S.history)?S.history:[], last=history[0];
  const selectedComplete=!live&&history.some(e=>e?.mission===mission&&e?.scenario===scenario);
  const stage=post?'After action':live?'In progress':selectedComplete?'Scenario recorded':'Ready to set up';
  const people=all(), ids=Array.isArray(S.session?.participants)?S.session.participants:null;
  const squad=people.filter(c=>live&&ids?ids.includes(c.id):c.active!==false&&!c.dead&&!c.retired);
  const reserve=people.filter(c=>!squad.includes(c)&&!c.dead&&!c.retired).length;
  const standing=squad.filter(c=>n(c.hp)>0&&!c.dead&&!c.retired).length;
  const downed=squad.filter(c=>n(c.hp)<=0&&!c.dead&&!c.retired).length;
  const objectives=Array.isArray(S.objectives)?S.objectives.filter(Boolean):[];
  const done=objectives.filter(o=>o.done).length;
  const metrics=live?[
    ['Turn',n(S.turn,1)+(n(S.roundLimit)>0?' / '+n(S.roundLimit):'')],
    ['Phase',post?'After action':phases[S.phase]||'Not set'],
    ['Objectives',objectives.length?done+' / '+objectives.length:'None tracked'],
    ['Scenario XP',n(S.scenarioXP)+' XP']
  ]:[
    ['Scenarios recorded',history.length],
    ['Standing',standing+' / '+squad.length],
    ['Downed',downed],
    ['In reserve',reserve]
  ];
  const missionButton=live?(post?'Continue after-action':'Resume battle'):(selectedComplete?'Review missions':'Open mission briefing');
  const group=(name,role,empty)=>{
    const list=squad.filter(c=>c.kind===role);
    return '<section class="command-group"><div class="row between"><h2>'+name+'</h2><span class="command-chip">'+list.length+'</span></div>'+
      (list.length?list.map(c=>commandMember(c,people.indexOf(c))).join(''):'<div class="panel muted">'+empty+'</div>')+'</section>';
  };
  const links=[['map','Missions','campaign'],['book','Journal','journal'],['skull','Bestiary','bestiary'],['plus','Recruit','recruit'],['spark','Spellbook & gear','library'],['dice','Dice & tools','tools'],['save','Backup','settings']];
  return '<div class="command-board"><section class="panel stack hero-banner command-mission">'+
    '<div class="row between"><div><div class="eyebrow">Command · '+esc(S.title||'Unnamed company')+'</div><h2 class="command-title">'+esc(scenario)+'</h2>'+
    '<p class="command-trail">'+esc(mission)+'</p></div><button class="primary" onclick="show(\''+(live?'play':'campaign')+'\')">'+missionButton+' →</button></div>'+
    '<div class="command-chips"><span class="command-chip '+(live?'alert':'ready')+'">'+stage+'</span>'+
    (S.challenge?'<span class="command-chip alert">Challenge</span>':'')+
    (live?'<span class="command-chip">'+standing+' / '+squad.length+' standing</span>':'')+'</div>'+
    '<div class="command-metrics">'+metrics.map(([k,v])=>'<div class="command-metric"><small>'+k+'</small><b>'+esc(v)+'</b></div>').join('')+'</div>'+
    '<div class="command-last">'+(last?'Last recorded: <b>'+esc(last.scenario||'Unnamed scenario')+'</b> · '+n(last.xp)+' XP per eligible ranger':'No scenarios recorded yet.')+'</div></section>'+
    '<section class="command-group"><div class="row between"><div><div class="eyebrow">Company status</div><h2>'+(live?'Scenario party':'Current party')+'</h2></div>'+
    '<button onclick="show(\'party\')">View party'+(reserve?' · '+reserve+' in reserve':'')+'</button></div>'+
    '<div class="command-lists">'+group('Rangers','ranger','No rangers are deployed.')+
    group('Companions','companion','No companions are deployed.')+'</div></section>'+
    '<details class="panel command-quick"><summary>Campaign shortcuts</summary><div class="quick-grid">'+links.map(([i,t,k])=>'<button class="quick" onclick="show(\''+k+'\')">'+icon(i)+'<b>'+t+'</b></button>').join('')+'</div></details></div>';
}
dashboard=commandDashboard;

$('brandMark').innerHTML=icon('crest');render();save();
</script></body></html>
